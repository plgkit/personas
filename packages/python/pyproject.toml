[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plgkit-personas"
version = "0.0.1"
description = "PLGKit personas: turn product events into one persona per user."
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.2"]

[project.scripts]
plgkit-personas = "plgkit_personas.cli:main"

[tool.setuptools.packages.find]
include = ["plgkit_personas*"]

[tool.setuptools.package-data]
plgkit_personas = ["migrations/*.sql"]
