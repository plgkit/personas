# Product verbs for the sample docs app.
# One action, one category: core_action, invite_sent, or setup_step.
# An action that is not listed is stored and does not change the persona.

created_doc: core_action
edited_doc: core_action
sent_invite: invite_sent
copied_invite_link: invite_sent
connected_slack: setup_step
created_workspace: setup_step
picked_template: setup_step
